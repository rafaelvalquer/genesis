name: V44 Hardening Codemod

on:
  push:
    branches:
      - refactor/v44-hardening-complete

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[codemod-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v44-hardening-complete
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply codemod
        run: node scripts/apply-v44-hardening-codemod.mjs

      - name: Validate focused refactor
        run: npm run test:unit && npm run build

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/BattleScreen.jsx src/game/render/entityRenderer.js
          git commit -m "refactor: finish battle interaction and troop effect boundaries [codemod-applied]"
          git push origin HEAD:refactor/v44-hardening-complete
