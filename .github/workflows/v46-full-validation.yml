name: V46 Full Validation

on:
  push:
    branches: [fix/v46-campaign-history-ci]

permissions:
  contents: read

jobs:
  full-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full Genesis gate
        run: npm run ci
