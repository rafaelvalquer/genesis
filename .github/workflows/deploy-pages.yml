name: Deploy Genesis Defense to GitHub Pages

on:
  workflow_run:
    workflows: ["Genesis CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI-approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full gate for manual deployments
        if: github.event_name == 'workflow_dispatch'
        run: npm run ci

      - name: Build for GitHub Pages
        run: npm run build

      - name: Verify GitHub Pages build
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/models/command/genesis-planeta-multibiomas1.glb
          test -f dist/models/command/low-poly-rocket-ship.glb

          CAMPAIGN_CHUNK="$(find dist/assets -type f -name 'CampaignPage-*.js' -print -quit)"
          if [ -z "$CAMPAIGN_CHUNK" ]; then
            echo "CampaignPage JavaScript chunk not found in dist/assets."
            exit 1
          fi

          echo "GitHub Pages build validated successfully."
          echo "Campaign chunk: $CAMPAIGN_CHUNK"
          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
