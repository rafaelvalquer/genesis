name: Deploy Genesis Defense to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete CI gate
        run: npm run ci

      - name: Verify GitHub Pages build
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/models/command/genesis-planeta-multibiomas1.glb
          test -f dist/models/command/low-poly-rocket-ship.glb

          CAMPAIGN_CHUNK="$(find dist/assets -type f -name 'CampaignPage-*.js' -print -quit)"
          if [ -z "$CAMPAIGN_CHUNK" ]; then
            echo "CampaignPage JavaScript chunk not found in dist/assets."
            exit 1
          fi

          echo "GitHub Pages build validated successfully."
          echo "Campaign chunk: $CAMPAIGN_CHUNK"
          du -sh dist

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
