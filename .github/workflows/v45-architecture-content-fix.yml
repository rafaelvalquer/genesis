name: Apply V45 architecture/content fixes

on:
  push:
    branches:
      - fix/v45-architecture-content-gates

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v45-architecture-content-gates
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply architecture and content fixes
        run: node scripts/apply-v44-hardening-codemod.mjs

      - name: Remove one-shot migration tooling
        run: |
          git rm .github/workflows/v45-architecture-content-fix.yml
          git rm scripts/apply-v44-hardening-codemod.mjs
          git rm scripts/apply-quality-gates.mjs

      - name: Validate requested architecture/content scope
        run: |
          git diff --check
          npm run verify:encoding
          npm run verify:repository-hygiene
          npm run validate:game-content
          npm run verify:no-gameplay-skips
          npm run verify:gamecanvas-render-dependencies
          npm run verify:battle-loading
          npm run verify:play-route
          npm run test:unit
          npm run test:icaro
          npm run test:gameplay-contracts
          npm run test:chapter-seven
          npm run audit:chapter-seven
          npm run audit:interceptador-icaro
          npm run build

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete battle architecture and content gates"
          git push origin HEAD:fix/v45-architecture-content-gates
