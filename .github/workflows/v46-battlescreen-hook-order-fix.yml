name: Apply V46 BattleScreen hook-order fix

on:
  push:
    branches:
      - fix/v46-battlescreen-hook-order

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v46-battlescreen-hook-order
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix BattleScreen hook order and harden loading contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const screenPath = 'src/game/BattleScreen.jsx';
          let screen = fs.readFileSync(screenPath, 'utf8');
          const overlayHook = '  const overlayModel = useMemo(() => getOverlayModel({ fortuneBlocksIntermission }), [getOverlayModel, fortuneBlocksIntermission]);\n';
          const loadingGuard = '  if (!loading.ready) {\n';
          const overlayIndex = screen.indexOf(overlayHook);
          const loadingIndex = screen.indexOf(loadingGuard);

          if (overlayIndex < 0) throw new Error('overlayModel useMemo não encontrado em BattleScreen.jsx');
          if (loadingIndex < 0) throw new Error('loading guard não encontrado em BattleScreen.jsx');
          if (overlayIndex < loadingIndex) throw new Error('overlayModel já está antes do loading guard; codemod não deve ser reaplicado');

          screen = screen.replace(overlayHook, '');
          screen = screen.replace(loadingGuard, `${overlayHook}\n${loadingGuard}`);
          fs.writeFileSync(screenPath, screen);

          const contractPath = 'scripts/check-battle-loading-contract.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const anchor = 'const eventSource = read("src/game/hooks/battleCanvasEvents.js");\n';
          const hardening = `\nconst loadingGuardIndex = battleScreenSource.indexOf("  if (!loading.ready) {");\nif (loadingGuardIndex < 0) {\n  errors.push("BattleScreen.jsx não possui o guard de carregamento esperado.");\n} else {\n  const hooksAfterLoadingGuard = [...battleScreenSource\n    .slice(loadingGuardIndex)\n    .matchAll(/\\b(use[A-Z][A-Za-z0-9_]*)\\s*\\(/g)]\n    .map((match) => match[1]);\n  if (hooksAfterLoadingGuard.length) {\n    errors.push(\`BattleScreen.jsx chama Hooks após o retorno condicional de carregamento: \${[...new Set(hooksAfterLoadingGuard)].join(", ")}.\`);\n  }\n}\n`;

          if (!contract.includes(anchor)) throw new Error('âncora do contrato de loading não encontrada');
          if (contract.includes('hooksAfterLoadingGuard')) throw new Error('hardening do contrato já aplicado');
          contract = contract.replace(anchor, anchor + hardening);
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Remove one-shot workflow
        run: git rm .github/workflows/v46-battlescreen-hook-order-fix.yml

      - name: Validate hook-order regression
        run: |
          git diff --check
          npm run verify:battle-loading
          npm run verify:play-route
          npm run test:unit
          npm run build

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve BattleScreen hook order across loading"
          git push origin HEAD:fix/v46-battlescreen-hook-order
