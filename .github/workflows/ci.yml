name: Genesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene and content contracts
        run: node scripts/verify-repository-hygiene.mjs && node scripts/validate-game-content.mjs

      - name: Fast pull-request gate
        if: github.event_name == 'pull_request'
        run: |
          npm run verify:encoding
          npm run verify:no-gameplay-skips
          npm run test:icaro
          npm run test:unit
          npm run test:chapter-seven
          npm run audit:chapter-seven
          npm run build

      - name: Full main gate
        if: github.event_name != 'pull_request'
        run: npm run ci
