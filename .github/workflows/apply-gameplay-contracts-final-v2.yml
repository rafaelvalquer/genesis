name: Apply latest-version hardening v3

on:
  push:
    branches:
      - fix/latest-version-hardening-v3

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply gameplay contract fixes
        run: node scripts/apply-gameplay-final-v2.mjs

      - name: Apply latest hardening fixes
        run: node scripts/apply-latest-hardening.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full CI
        run: npm run ci

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json scripts/stress-phase48.mjs src/game/battle/engine.js src/game/domain.js src/game/windCurrent.js src/game/windCurrent.test.js src/game/latestHardening.test.js src/loadout/TroopPortraitTile.jsx src/loadout/LoadoutPage.test.jsx src/campaign/CampaignPage.test.jsx
          git rm -- scripts/apply-gameplay-final-v2.mjs scripts/apply-latest-hardening.mjs .github/workflows/apply-gameplay-contracts-final-v2.yml
          git commit -m "fix: harden latest gameplay contracts and validation"
          git push origin HEAD:fix/latest-version-hardening-v3
